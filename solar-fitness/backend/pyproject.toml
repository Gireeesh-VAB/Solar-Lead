[project]
name = "solarfit"
version = "0.1.0"
description = "Solar Site Fitness & Capacity Engine — rooftop backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "affine>=3.0.0",
    "alembic>=1.19.1",
    "bcrypt>=4.2.0",
    "boto3>=1.43.80",
    "celery>=5.6.3",
    "fastapi>=0.141.1",
    "geoalchemy2>=0.20.0",
    "google-cloud-vision>=3.15.0",
    "httpx>=0.28.1",
    "openai>=3.3.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.10.0",
    "pyproj>=3.7.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.1",
    "redis>=8.1.0",
    "scikit-learn>=1.9.0",
    "shapely>=2",
    "sqlalchemy>=2",
    "trimesh>=5.0.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
