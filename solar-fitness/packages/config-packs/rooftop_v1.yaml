# Versioned parameter pack — CFG-01: every coefficient lives here, none
# hard-coded in application logic. Loaded via packs/config_pack.py.
#
# STATUS: placeholder values only, seeded on Day 0 so nobody is blocked.
# Person 2 owns tuning these to real numbers (§9.4/§9.6/§10.3 Rules Engine).

version: "rooftop_v1"

# AREA-05 — utilisation factor by class, used where per-site precision
# is unavailable. Read by Person 1's engine/area.py.
utilisation_factor:
  ROOFTOP_GOVT: 0.75
  ROOFTOP_RESIDENTIAL: 0.70
  ROOFTOP_CI: 0.72

# CACHE-01 — lat/long rounding precision (decimal places) for the result
# cache key. 5 decimal places is roughly 1.1m at the equator. Read by
# Person 3's repositories/analysis_cache.py.
cache_precision: 5

# AREA-03 — edge setback, metres, applied as a negative buffer in a
# projected CRS. Placeholder.
edge_setback_m: 0.5

# CON-07 — minimum viable system size, kWp, below which a site is gated
# out regardless of other ceilings. Placeholder.
minimum_viable_kwp: 1.0

# OBS-04 — confidence at/above which a detected obstacle auto-applies to
# the site's exclusions (versioned via SITE-05) rather than staying
# advisory-only (OBS-05). Read by Person 3's engine/obstacles.py.
auto_apply_confidence_threshold: 0.85

# SHADE-03 — generation performance derate per shading_score unit
# (GEN-01's performance ratio is multiplied by (1 - shading_score * this
# factor)). Placeholder. Read by Person 2's engine/generation.py.
shading_derate_factor: 1.0

