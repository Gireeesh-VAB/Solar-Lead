name: solarfit

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: solarfit
      POSTGRES_PASSWORD: solarfit
      POSTGRES_DB: solarfit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solarfit -d solarfit"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
